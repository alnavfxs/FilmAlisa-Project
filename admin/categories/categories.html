<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories — Filmalisa Admin</title>
    <link rel="stylesheet" href="./categories.css" />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="dashboard">
        <div
          id="sidebar-placeholder"
          data-type="admin"
          data-active="categories"
        ></div>

        <!-- Main content -->
        <main class="dashboard_content">
          <div class="dashboard_content_hello">
            <div class="dashboard_content_hello_1">
              <p>Hi Admin</p>
              <h3>Categories</h3>
            </div>
            <div class="dashboard_content_hello_2">
              <button class="button" id="createCategoryBtn" type="button">
                Create
              </button>
              <img src="../../assets/icons/Ellipse 6.svg" alt="" />
              <h3>Admin</h3>
            </div>
          </div>

          <table class="table_content">
            <thead>
              <tr>
                <th>Name</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="categoriesTableBody">
              <tr data-id="1">
                <td class="cell-name">Action</td>
                <td>
                  <button
                    class="table-btn table-btn--edit"
                    type="button"
                    title="Edit"
                  >
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button
                    class="table-btn table-btn--delete"
                    type="button"
                    title="Delete"
                  >
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </main>
      </div>
    </div>

    <!-- Create / Edit category modal -->
    <div class="modalDiv" id="categoryModal">
      <div class="modalContent">
        <button
          class="close"
          id="closeModalBtn"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>

        <form id="categoryForm" class="category-form">
          <input
            class="category-form__input"
            type="text"
            id="categoryName"
            placeholder="category name"
            required
          />
          <button class="category-form__submit" type="submit">Submit</button>
        </form>
      </div>
    </div>

    <script src="../../global/api.js"></script>
    <script src="../../global/layout.js"></script>
    <script src="./categories.js"></script>
  </body>
</html>
