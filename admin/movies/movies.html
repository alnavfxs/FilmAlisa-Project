<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies — Filmalisa Admin</title>
    <link rel="stylesheet" href="./movies.css" />
    <link rel="stylesheet" href="../../global/css/components/admin-modal.css" />
    <link rel="stylesheet" href="../../global/css/components/admin-pagination.css" />
    <link rel="stylesheet" href="../../global/css/components/text-popover.css" />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="dashboard">
        <div
          id="sidebar-placeholder"
          data-type="admin"
          data-active="movies"
        ></div>

        <!-- Main content -->
        <main class="dashboard_content">
          <div class="dashboard_content_hello">
            <div class="dashboard_content_hello_1">
              <p>Hi Admin</p>
              <h3>Movies</h3>
            </div>
            <div class="dashboard_content_hello_2">
              <button class="button" id="createMovieBtn" type="button">
                Create
              </button>
              <img src="../../assets/icons/Ellipse 6.svg" alt="" />
              <h3>Admin</h3>
            </div>
          </div>

          <table class="table_content">
            <thead>
              <tr>
                <th>Poster</th>
                <th>Title</th>
                <th>Overview</th>
                <th>IMDB</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="moviesTableBody">
              <tr>
                <td colspan="5" class="table-empty">Loading…</td>
              </tr>
            </tbody>
          </table>
          <div class="table-pager d-none" id="moviesPager"></div>
        </main>
      </div>
    </div>

    <!-- Create / Edit movie modal -->
    <div class="modalDiv" id="movieModal">
      <div class="modalContent">
        <button
          class="close"
          id="closeModalBtn"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>

        <form id="movieForm" class="movie-form">
          <div class="movie-form__fields">
            <input
              class="movie-form__input"
              type="text"
              id="movieTitle"
              placeholder="title"
              required
            />

            <textarea
              class="movie-form__input movie-form__textarea"
              id="movieOverview"
              placeholder="overview"
              rows="3"
            ></textarea>

            <input
              class="movie-form__input"
              type="text"
              id="movieCover"
              placeholder="cover url"
            />

            <input
              class="movie-form__input"
              type="text"
              id="movieTrailer"
              placeholder="fragman (youtube embed url)"
            />

            <input
              class="movie-form__input"
              type="text"
              id="movieWatchUrl"
              placeholder="watch url"
            />

            <input
              class="movie-form__input"
              type="number"
              id="movieImdb"
              placeholder="imdb"
              min="0"
              max="10"
              step="0.1"
              required
            />

            <input
              class="movie-form__input"
              type="number"
              id="movieRuntime"
              placeholder="run time minute"
              min="0"
            />

            <select
              class="movie-form__input movie-form__select"
              id="movieCategory"
              required
            >
              <option value="" disabled selected>category</option>
            </select>

            <label class="movie-form__label" for="movieActors">actors</label>
            <select
              class="movie-form__input movie-form__select movie-form__select--multi"
              id="movieActors"
              multiple
              size="5"
            ></select>

            <div class="movie-form__footer">
              <label class="movie-form__checkbox">
                <input type="checkbox" id="movieAdult" />
                <span>Adult</span>
              </label>
              <button class="movie-form__submit" type="submit">Submit</button>
            </div>
          </div>

          <div class="movie-form__preview">
            <img
              id="moviePreviewImg"
              src="../../assets/images/lost-in-space-poster.svg"
              alt=""
              class="movie-form__preview-img"
            />
          </div>
        </form>
      </div>
    </div>

    <!-- Confirmation Modal (Yeni Eklenen) -->
    <div class="modalDiv" id="deleteModal">
      <div class="modalContent modalContent--small">
        <button
          class="close"
          id="closeDeleteModalBtn"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
        <div class="modal-body">
          <h3 class="modal-title"></h3>
          <p class="modal-text">This action cannot be undone after deletion.</p>
          <div class="modal-actions">
            <button
              id="cancelDeleteBtn"
              class="category-form__submit btn-cancel"
              type="button"
            >
              Cancel
            </button>
            <button
              id="confirmDeleteBtn"
              class="category-form__submit btn-danger"
              type="button"
            >
              Yes, Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../global/js/core/api.js?v=4"></script>
    <script src="../../global/js/components/layout.js?v=5"></script>
    <script src="../../global/js/components/admin-pagination.js"></script>
    <script src="../../global/js/components/text-popover.js"></script>
    <script src="./movies.js"></script>
  </body>
</html>
