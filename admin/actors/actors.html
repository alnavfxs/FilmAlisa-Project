<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actors — Filmalisa Admin</title>
    <link rel="stylesheet" href="./actors.css" />
    <link rel="stylesheet" href="./actors.css" />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="dashboard">
        <div
          id="sidebar-placeholder"
          data-type="admin"
          data-active="actors"
        ></div>

        <!-- Main content -->
        <main class="dashboard_content">
          <div class="dashboard_content_hello">
            <div class="dashboard_content_hello_1">
              <p>Hi Admin</p>
              <h3>Actors</h3>
            </div>
            <div class="dashboard_content_hello_2">
              <!-- Create Düyməsi -->
              <button class="button" id="createActorBtn" type="button">
                Create
              </button>
              <img src="../../assets/icons/Ellipse 6.svg" alt="" />
              <h3>Admin</h3>
            </div>
          </div>

          <table class="table_content">
            <thead>
              <tr>
                <th>ID</th>
                <th>Photo & Name</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="actorsTableBody">
              <tr data-id="1">
                <td>1</td>
                <td>
                  <div class="cell-profile">
                    <img
                      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3pg1oEIKiw_3odQPBONwOt-FfQiI8mRMuIMELt9lQEtuisjibig5nKHw&s=10"
                      alt="Cillian Murphy"
                    />
                    <span class="cell-name">Cillian Murphy</span>
                  </div>
                </td>
                <td class="cell-bio">Oppenheimer, Peaky Blinders</td>
                <td>
                  <button
                    class="table-btn table-btn--edit"
                    type="button"
                    title="Edit"
                  >
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button
                    class="table-btn table-btn--delete"
                    type="button"
                    title="Delete"
                  >
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </td>
              </tr>

              <tr data-id="2">
                <td>2</td>
                <td>
                  <div class="cell-profile">
                    <img
                      src="https://assets.vogue.com/photos/6731346474f550dffdc2b1d5/1:1/w_1410,h_1410,c_limit/GettyImages-596304914.jpg"
                      alt="Leonardo DiCaprio"
                    />
                    <span class="cell-name">Leonardo DiCaprio</span>
                  </div>
                </td>
                <td class="cell-bio">Inception, The Wolf of Wall Street</td>
                <td>
                  <button
                    class="table-btn table-btn--edit"
                    type="button"
                    title="Edit"
                  >
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button
                    class="table-btn table-btn--delete"
                    type="button"
                    title="Delete"
                  >
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </main>
      </div>
    </div>

    <!-- Create / Edit Modal -->
    <div class="modalDiv" id="actorModal">
      <div class="modalContent">
        <button
          class="close"
          id="closeModalBtn"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>

        <form id="actorForm" class="category-form">
          <h3 class="modal-title" id="modalTitle">Create Actor</h3>

          <input
            class="category-form__input"
            type="text"
            id="actorName"
            placeholder="First name"
            required
          />
          <input
            class="category-form__input"
            type="text"
            id="actorSurname"
            placeholder="Surname"
            required
          />
          <input
            class="category-form__input"
            type="url"
            id="actorImage"
            placeholder="Image URL (e.g. https://...)"
            required
          />

          <button class="category-form__submit" type="submit">Submit</button>
        </form>
      </div>
    </div>

    <script src="../../global/api.js"></script>
    <script src="../../global/layout.js"></script>
    <script src="./actors.js"></script>
  </body>
</html>
