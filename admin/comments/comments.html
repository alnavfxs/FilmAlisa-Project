<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../global/js/components/page-loader.js?v=1"></script>
    <title>Comments — Filmalisa Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" />
    <link rel="stylesheet" href="../../global/css/global.css" />
    <link rel="stylesheet" href="../../global/css/layout/admin-layout.css" />
    <link rel="stylesheet" href="./comments.css" />
    <link rel="stylesheet" href="../../global/css/components/admin-modal.css" />
    <link rel="stylesheet" href="../../global/css/components/admin-pagination.css" />
    <link rel="stylesheet" href="../../global/css/components/text-popover.css" />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="dashboard">
        <div
          id="sidebar-placeholder"
          data-type="admin"
          data-active="comments"
        ></div>

        <!-- Main content -->
        <main class="dashboard_content">
          <div class="dashboard_content_hello">
            <div class="dashboard_content_hello_1">
              <p>Hi Admin</p>
              <h3>Comments</h3>
            </div>
            <div class="dashboard_content_hello_2">
              <img src="../../assets/icons/Ellipse 6.svg" alt="" />
              <h3>Admin</h3>
            </div>
          </div>

          <table class="table_content">
            <thead>
              <tr>
                <th>ID</th>
                <th>Movie</th>
                <th>User Comment</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="commentsTableBody">
              <tr>
                <td colspan="4" class="table-empty">Loading…</td>
              </tr>
            </tbody>
          </table>
          <div class="table-pager d-none" id="commentsPager"></div>
        </main>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div class="modalDiv" id="deleteModal">
      <div class="modalContent modalContent--small">
        <button
          class="close"
          id="closeModalBtn"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
        <div class="modal-body">
          <h3 class="modal-title"></h3>
          <p class="modal-text">This action cannot be undone after deletion.</p>
          <div class="modal-actions">
            <button
              id="cancelDeleteBtn"
              class="category-form__submit btn-cancel"
              type="button"
            >
              Cancel
            </button>
            <button
              id="confirmDeleteBtn"
              class="category-form__submit btn-danger"
              type="button"
            >
              Yes, Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../global/js/core/api.js?v=5"></script>
    <script src="../../global/js/components/layout.js?v=5"></script>
    <script src="../../global/js/components/admin-pagination.js"></script>
    <script src="../../global/js/components/text-popover.js"></script>
    <script src="./comments.js"></script>
  </body>
</html>
