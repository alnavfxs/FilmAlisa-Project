<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../global/js/components/page-loader.js?v=1"></script>
    <title>Admin_Panel</title>
    <link rel="stylesheet" href="./admin_panel.css" />
  </head>
  <body>
    <main class="admin-page">
      <div class="admin-page__container">
        <div class="admin-page__brand">
          <img
            src="../../assets/images/728dbadd7dad4c8f1455e46acab13802b64bef68.png"
            alt=""
            class="admin-page__logo"
          />
          <h1 class="admin-page__title">Admin</h1>
        </div>

        <form class="admin-form" id="adminLoginForm" action="#" novalidate>
          <div class="admin-form__field">
            <span
              ><img
                src="../../assets/icons/sms.svg"
                alt=""
                class="admin-form__icon admin-form__icon--user"
            /></span>
            <input
              class="admin-form__input"
              type="text"
              name="username"
              id="usernameInput"
              placeholder="username"
              autocomplete="username"
              required
            />
          </div>

          <div class="admin-form__field">
            <span
              ><img
                src="../../assets/icons/Left Icon.svg"
                alt=""
                class="admin-form__icon admin-form__icon--lock"
            /></span>
            <input
              class="admin-form__input"
              type="password"
              name="password"
              id="passwordInput"
              placeholder="password"
              autocomplete="current-password"
              required
            />
            <button
              class="admin-form__toggle"
              type="button"
              id="togglePassword"
              aria-label="show password"
            >
              <img src="../../assets/icons/passwordtog.svg" alt="" />
            </button>
          </div>

          <p class="form-error" id="formError" role="alert"></p>
          <button class="admin-form__submit" type="submit">login</button>
        </form>
      </div>
    </main>

    <script src="../../global/js/core/api.js?v=4"></script>
    <script src="./admin_panel.js"></script>
  </body>
</html>
