<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Filmalisa Admin</title>
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <div class="container">
      <div class="dashboard">
        <div id="sidebar-placeholder" data-type="admin" data-active="dashboard"></div>

        <!-- Main content -->
        <main class="dashboard_content">
          <div class="dashboard_content_hello">
            <div class="dashboard_content_hello_1">
              <p>Hi Admin</p>
              <h3>Dashboard</h3>
            </div>
            <div class="dashboard_content_hello_2">
              <img src="../../assets/icons/Ellipse 6.svg" alt="" />
              <h3>Admin</h3>
            </div>
          </div>

          <div class="dashboards_cards">
            <div class="card">
              <p>Favorite actions</p>
              <h3 id="statFavorites">—</h3>
            </div>
            <div class="card">
              <p>Users</p>
              <h3 id="statUsers">—</h3>
            </div>
            <div class="card">
              <p>Movies</p>
              <h3 id="statMovies">—</h3>
            </div>
            <div class="card">
              <p>Comments</p>
              <h3 id="statComments">—</h3>
            </div>
            <div class="card">
              <p>Categories</p>
              <h3 id="statCategories">—</h3>
            </div>
            <div class="card">
              <p>Actors</p>
              <h3 id="statActors">—</h3>
            </div>
            <div class="card">
              <p>Contacts</p>
              <h3 id="statContacts">—</h3>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../../global/js/core/api.js?v=4"></script>
    <script src="../../global/js/components/layout.js?v=5"></script>
    <script src="./dashboard.js"></script>
  </body>
</html>
