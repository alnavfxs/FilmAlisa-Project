<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../global/js/components/page-loader.js?v=1"></script>
    <title>filmalisa - 404</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" />
    <link rel="stylesheet" href="../../global/css/global.css" />
    <link rel="stylesheet" href="../../global/css/layout/app-sidebar.css" />
    <link rel="stylesheet" href="./404.css" />
    <link rel="stylesheet" href="../../global/css/layout/mobile.css?v=5" />
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <a href="../../index.html" class="sidebar-link" title="Landing Page">
          <img
            src="../../assets/images/filmalisa.svg"
            alt="Filmalisa Logo"
            class="svg-logo"
          />
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="../home/home.html" class="sidebar-link" title="Home">
          <img src="../../assets/icons/home.svg" alt="Home" class="svg-icon" />
        </a>
        <a
          href="../search-panel/search.html"
          class="sidebar-link"
          title="Movies Search"
        >
          <img
            src="../../assets/icons/search.svg"
            alt="Movies"
            class="svg-icon"
          />
        </a>
        <a href="../account/account.html" class="sidebar-link" title="Account">
          <img
            src="../../assets/icons/account.svg"
            alt="Account"
            class="svg-icon"
          />
        </a>
        <a
          href="../favourite/favourite.html"
          class="sidebar-link"
          title="Favorites"
        >
          <img
            src="../../assets/icons/favourite.svg"
            alt="Favorites"
            class="svg-icon"
          />
        </a>
      </nav>

      <button
        type="button"
        class="sidebar-link sidebar-logout"
        id="appLogoutBtn"
        title="Logout"
      >
        <img src="../../assets/icons/logout-sidebar.svg" alt="Logout" class="svg-icon" />
      </button>
    </aside>

    <!-- MAIN -->
    <main class="content">
      <section class="not-found" aria-labelledby="nfTitle">
        <img
          src="../../assets/images/404-error.svg"
          alt=""
          class="not-found-img"
        />

        <span class="not-found-badge" id="nfBadge">Error 404</span>
        <h1 class="not-found-title" id="nfTitle">Lost your way?</h1>
        <p class="not-found-text" id="nfText">
          Oops! This is awkward. You are looking for something that doesn't
          actually exist.
        </p>

        <!-- Yalnız axtarışdan gələndə göstərilir (nfQuery textContent ilə doldurulur) -->
        <p class="not-found-query" id="nfQueryBox" hidden>
          <i class="bi bi-search" aria-hidden="true"></i>
          <span id="nfQuery"></span>
        </p>

        <div class="not-found-actions">
          <a
            href="../search-panel/search.html"
            class="nf-btn nf-btn--primary"
            id="nfSearchBtn"
            hidden
          >
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Try another search
          </a>
          <a href="../home/home.html" class="nf-btn nf-btn--ghost" id="nfHomeBtn">
            <i class="bi bi-house-door" aria-hidden="true"></i> Go Home
          </a>
        </div>
      </section>
    </main>

    <script src="../../global/js/core/api.js?v=5"></script>
    <script src="./404.js"></script>
  </body>
</html>
