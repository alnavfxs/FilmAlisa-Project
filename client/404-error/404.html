<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../404-error/404.css" />
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <a href="../../index.html" class="sidebar-link" title="Landing Page">
          <img
            src="../../assets/images/filmalisa.svg"
            alt="Filmalisa Logo"
            class="svg-logo"
        /></a>
      </div>

      <nav class="sidebar-nav">
        <a href="../home/home.html" class="sidebar-link" title="Home">
          <img src="../../assets/icons/home.svg" alt="Home" class="svg-icon" />
        </a>
        <a
          href="../search-panel/search.html"
          class="sidebar-link"
          title="Movies/Series"
        >
          <img
            src="../../assets/icons/search.svg"
            alt="Movies"
            class="svg-icon"
          />
        </a>
        <a href="../account/account.html" class="sidebar-link" title="Account">
          <img
            src="../../assets/icons/account.svg"
            alt="Account"
            class="svg-icon"
          />
        </a>
        <a href="#" class="sidebar-link" title="Favorites">
          <img
            src="../../assets/icons/favourite.svg"
            alt="Favorites"
            class="svg-icon"
          />
        </a>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="content">
      <div class="not-found">
        <img
          src="../../assets/images/404-error.svg"
          alt="Lost"
          class="not-found-img"
        />
        <h1 class="not-found-title">Lost your way?</h1>
        <p class="not-found-text">
          Oops! This is awkward. You are looking for something that doesn't
          actually exist.
        </p>
        <a href="../home/home.html" class="go-home-btn">Go Home</a>
      </div>
    </main>
  </body>
</html>
