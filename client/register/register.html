<!doctype html>
<html translate="no" lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../global/js/components/page-loader.js?v=1"></script>
    <title>filmalisa — register</title>
    <link rel="stylesheet" href="./register.css" />
  </head>
  <body>
    <main class="login-page">
      <div class="login-page__container">
        <div class="login-page__brand">
          <img
            src="../../assets/images/filmalisa.svg"
            alt=""
            class="login-page__logo"
          />
          <h1 class="login-page__title">Filmalisa</h1>
        </div>

        <h2 class="login-page__subtitle">Register</h2>

        <form class="login-form" id="registerForm" action="#">
          <div class="login-form__field">
            <span
              ><img
                src="../../assets/icons/user.svg"
                alt=""
                class="login-form__icon login-form__icon--user"
            /></span>
            <input
              class="login-form__input"
              type="text"
              name="fullname"
              id="fullnameInput"
              placeholder="Full name"
              autocomplete="name"
              required
            />
          </div>

          <div class="login-form__field">
            <span
              ><img
                src="../../assets/icons/login.svg"
                alt=""
                class="login-form__icon login-form__icon--mail"
            /></span>
            <input
              class="login-form__input"
              type="email"
              name="email"
              id="emailInput"
              placeholder="Email"
              autocomplete="email"
              required
            />
          </div>

          <div class="login-form__field">
            <span
              ><img
                src="../../assets/icons/lock.svg"
                alt=""
                class="login-form__icon login-form__icon--lock"
            /></span>
            <input
              class="login-form__input"
              type="password"
              name="password"
              id="passwordInput"
              placeholder="Password"
              autocomplete="new-password"
              required
            />
            <button
              class="login-form__toggle"
              type="button"
              id="togglePassword"
              aria-label="show password"
            >
              <img src="../../assets/icons/passwordtog.svg" alt="" />
            </button>
          </div>

          <div class="login-form__register-wrap">
            <a class="login-form__register" href="../login/login.html"
              >Do you have a account? Login here</a
            >
          </div>

          <button class="login-form__submit" type="submit">Register</button>
        </form>
      </div>
    </main>

    <script src="../../global/js/core/api.js?v=4"></script>
    <script src="./register.js"></script>
  </body>
</html>
