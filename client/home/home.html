<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>filmalisa - home</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- BOOTSTRAP ICONS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- HOME CSS -->
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body>
    <!-- SIDEBAR (layout.js ilə qurulur) -->
    <div id="sidebar-placeholder" data-type="app" data-active="home"></div>

    <section class="hero" id="hero">
      <img id="heroBg" alt="" class="hero-bg" />
      <div class="hero-overlay">
        <span class="category-tag hero-tag" id="heroTag"></span>
        <div class="rating">
          <span id="heroRating"></span>
        </div>
        <h1 class="hero-title" id="heroTitle"></h1>
        <p class="hero-desc" id="heroDesc"></p>
        <button class="watch-now-btn" id="heroWatchBtn">Watch now</button>
      </div>
    </section>

    <!-- MAIN -->
    <main class="content" id="content">
      <!-- Film sətirləri home.js tərəfindən API-dən qurulur -->
    </main>
    <script src="../../global/js/core/api.js?v=4"></script>
    <script src="../../global/js/components/layout.js?v=5"></script>
    <script src="../../global/js/components/movie-ui.js"></script>
    <script src="./home.js"></script>
  </body>
</html>
