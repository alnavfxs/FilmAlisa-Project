<!doctype html>
<html translate="no" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>filmalisa - search panel</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- BOOTSTRAP ICONS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- SEARCH PANEL CSS -->
    <link rel="stylesheet" href="./search.css" />
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <a href="../../index.html" class="sidebar-link" title="Landing Page">
          <img
            src="../../assets/images/filmalisa.svg"
            alt="Filmalisa Logo"
            class="svg-logo"
        /></a>
      </div>

      <nav class="sidebar-nav">
        <a href="../home/home.html" class="sidebar-link" title="Home">
          <img src="../../assets/icons/home.svg" alt="Home" class="svg-icon" />
        </a>
        <a
          href="../search-panel/search.html"
          class="sidebar-link active"
          title="Movies/Series"
        >
          <img
            src="../../assets/icons/search-active.svg"
            alt="Movies"
            class="svg-icon"
          />
        </a>
        <a href="../account/account.html" class="sidebar-link" title="Account">
          <img
            src="../../assets/icons/account.svg"
            alt="Account"
            class="svg-icon"
          />
        </a>
        <a
          href="../favourite/favourite.html"
          class="sidebar-link"
          title="Favorites"
        >
          <img
            src="../../assets/icons/favourite.svg"
            alt="Favorites"
            class="svg-icon"
          />
        </a>
      </nav>

      <button type="button" class="sidebar-link sidebar-logout" id="appLogoutBtn" title="Logout">
        <img src="../../assets/icons/Logout.svg" alt="Logout" class="svg-icon" />
      </button>
    </aside>

    <!-- MAIN -->
    <main class="content">
      <div class="search-header">
        <h2 class="page-title">
          Search result
          <img src="../../assets/icons/arrow.svg" alt="arrow" class="title-arrow" />
        </h2>

        <div class="search-bar">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search..."
          />
          <button class="search-add-btn" id="searchBtn">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
      </div>

      <div class="movie-grid" id="searchResults"></div>
    </main>
    <!-- SEARCH PANEL JS -->
    <script src="../../global/api.js?v=4"></script>
    <script src="../../global/movie-ui.js"></script>
    <script src="../../global/layout.js?v=4"></script>
    <script src="../search-panel/search.js"></script>
  </body>
</html>
