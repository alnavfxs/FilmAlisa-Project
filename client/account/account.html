<!doctype html>
<html translate="no" lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>filmalisa - account</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- BOOTSTRAP ICONS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- ACCOUNT CSS -->
    <link rel="stylesheet" href="./account.css" />
    <link rel="stylesheet" href="../../global/mobile.css?v=1" />
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <a href="../../index.html" class="sidebar-link" title="Landing Page">
          <img
            src="../../assets/images/filmalisa.svg"
            alt="Filmalisa Logo"
            class="svg-logo"
        /></a>
      </div>

      <nav class="sidebar-nav">
        <a href="../home/home.html" class="sidebar-link" title="Home">
          <img src="../../assets/icons/home.svg" alt="Home" class="svg-icon" />
        </a>
        <a
          href="../search-panel/search.html"
          class="sidebar-link"
          title="Movies/Series"
        >
          <img
            src="../../assets/icons/search.svg"
            alt="Movies"
            class="svg-icon"
          />
        </a>
        <a
          href="../account/account.html"
          class="sidebar-link active"
          title="Account"
        >
          <img
            src="../../assets/icons/account-active.svg"
            alt="Account"
            class="svg-icon active-icon"
          />
        </a>
        <a
          href="../favourite/favourite.html"
          class="sidebar-link"
          title="Favorites"
        >
          <img
            src="../../assets/icons/favourite.svg"
            alt="Favorites"
            class="svg-icon"
          />
        </a>
      </nav>

      <button type="button" class="sidebar-link sidebar-logout" id="appLogoutBtn" title="Logout">
        <img src="../../assets/icons/Logout.svg" alt="Logout" class="svg-icon" />
      </button>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <div class="avatar-container" id="avatarContainer">
        <div class="avatar-placeholder" id="avatarPlaceholder">
          <img src="../../assets/icons/avatar-default.svg" alt="" class="avatar-default" />
          <span class="upload-badge"><i class="bi bi-camera-fill"></i></span>
        </div>

        <img src="" alt="Profile" class="avatar-img d-none" id="avatarImg" />
      </div>

      <!-- FORM -->
      <form id="accountForm" class="account-form">
        <div class="input-wrapper">
          <img src="../../assets/icons/login2.svg" class="input-icon" alt="image" />
          <input type="url" id="imageUrl" placeholder="Profile image URL" />
        </div>

        <div class="input-wrapper">
          <img src="../../assets/icons/login2.svg" class="input-icon" alt="user" />
          <input type="text" id="fullName" placeholder="Full Name" />
        </div>

        <div class="input-wrapper disabled-wrapper">
          <img src="../../assets/icons/login.svg" class="input-icon" alt="email" />
          <input type="email" id="email" disabled />
        </div>

        <div class="input-wrapper">
          <img src="../../assets/icons/login2.svg" class="input-icon" alt="lock" />
          <input type="password" id="password" placeholder="New password (optional)" />
          <img
            src="../../assets/icons/passwordtog.svg"
            class="action-icon"
            alt="toggle"
          />
        </div>

        <button type="submit" class="save-btn">Save</button>
      </form>
    </main>

    <script src="../../global/api.js?v=4"></script>
    <script src="../../global/layout.js?v=4"></script>
    <script src="./account.js?v=4"></script>
  </body>
</html>
