<!doctype html>
<html translate="no" lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../global/js/components/page-loader.js?v=1"></script>
    <title>filmalisa - account</title>
    <!-- BOOTSTRAP -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- BOOTSTRAP ICONS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- FONT AWESOME -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- ACCOUNT CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" />
    <link rel="stylesheet" href="../../global/css/global.css" />
    <link rel="stylesheet" href="../../global/css/layout/app-sidebar.css" />
    <link rel="stylesheet" href="./account.css" />
    <link rel="stylesheet" href="../../global/css/layout/mobile.css?v=5" />
  </head>
  <body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <a href="../../index.html" class="sidebar-link" title="Landing Page">
          <img
            src="../../assets/images/filmalisa.svg"
            alt="Filmalisa Logo"
            class="svg-logo"
        /></a>
      </div>

      <nav class="sidebar-nav">
        <a href="../home/home.html" class="sidebar-link" title="Home">
          <img src="../../assets/icons/home.svg" alt="Home" class="svg-icon" />
        </a>
        <a
          href="../search-panel/search.html"
          class="sidebar-link"
          title="Movies Search"
        >
          <img
            src="../../assets/icons/search.svg"
            alt="Movies"
            class="svg-icon"
          />
        </a>
        <a
          href="../account/account.html"
          class="sidebar-link active"
          title="Account"
        >
          <img
            src="../../assets/icons/account-active.svg"
            alt="Account"
            class="svg-icon active-icon"
          />
        </a>
        <a
          href="../favourite/favourite.html"
          class="sidebar-link"
          title="Favorites"
        >
          <img
            src="../../assets/icons/favourite.svg"
            alt="Favorites"
            class="svg-icon"
          />
        </a>
      </nav>

      <button type="button" class="sidebar-link sidebar-logout" id="appLogoutBtn" title="Logout">
        <img src="../../assets/icons/logout-sidebar.svg" alt="Logout" class="svg-icon" />
      </button>
    </aside>

    <!-- MAIN -->
    <main class="main-content">
      <div class="avatar-container" id="avatarContainer">
        <div class="avatar-placeholder" id="avatarPlaceholder">
          <img src="../../assets/icons/avatar-logo.svg" alt="" class="avatar-default" />
          <span class="upload-badge"><i class="bi bi-camera-fill"></i></span>
        </div>

        <img src="" alt="Profile" class="avatar-img d-none" id="avatarImg" />
      </div>

      <!-- FORM -->
      <form id="accountForm" class="account-form">
        <!-- İkonlar bəzəkdir (alt=""), sahənin adını input-un aria-label-ı verir -->
        <div class="input-wrapper">
          <img src="../../assets/icons/gallery.svg" class="input-icon" alt="" />
          <input type="url" id="imageUrl" placeholder="Profile image URL" aria-label="Profile image URL" />
        </div>

        <div class="input-wrapper">
          <img src="../../assets/icons/user.svg" class="input-icon" alt="" />
          <input type="text" id="fullName" placeholder="Full Name" aria-label="Full name" autocomplete="name" />
        </div>

        <div class="input-wrapper disabled-wrapper">
          <img src="../../assets/icons/login.svg" class="input-icon" alt="" />
          <input type="email" id="email" aria-label="Email" disabled />
        </div>

        <div class="input-wrapper">
          <img src="../../assets/icons/lock.svg" class="input-icon" alt="" />
          <input
            type="password"
            id="password"
            placeholder="New password (optional)"
            aria-label="New password"
            autocomplete="new-password"
          />
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
            <img src="../../assets/icons/passwordtog.svg" class="action-icon" alt="" />
          </button>
        </div>

        <button type="submit" class="save-btn">Save</button>
      </form>
    </main>

    <script src="../../global/js/core/api.js?v=5"></script>
    <script src="../../global/js/components/layout.js?v=5"></script>
    <script src="./account.js?v=5"></script>
  </body>
</html>
